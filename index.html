let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'success') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.3);
            });
        } else if (type === 'error') {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'click') {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.05);
        }
    } catch(e) {}
}

const K=i=>Q[i][1];
let S={ok:{},hard:{},fs:20},R,sel=null;
try{Object.assign(S,JSON.parse(localStorage.getItem("hania-przyroda-test")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("hania-przyroda-test",JSON.stringify(S))}catch(e){}};
const btn=(t,f)=>'<button class="b" onclick="'+f+'">'+t+'</button>';
function fs(d){S.fs=Math.min(30,Math.max(16,S.fs+d));document.documentElement.style.setProperty("--fs",S.fs+"px");save()}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="pl-PL";speechSynthesis.speak(u)}catch(e){}}
function menu(){
 let h='<h2>Co chcesz powtórzyć?</h2><p class="mu">Bez limitu czasu i bez ocen. Przy każdej odpowiedzi zobaczysz wyjaśnienie.</p>';
 h+=btn("Wszystkie pytania ("+Q.length+")","go(-1)");
 L.forEach((n,l)=>{const ids=Q.map((q,i)=>i).filter(i=>Q[i][0]==l),d=ids.filter(i=>S.ok[K(i)]).length;
  h+=btn((l+1)+". "+n+"<small>opanowane: "+d+" z "+ids.length+"</small>","go("+l+")")});
 const hd=Object.keys(S.hard).length;
 if(hd)h+=btn("Pytania do powtórki ("+hd+")","go(-2)");
 $("app").innerHTML=h}
function go(l){
 const ids=Q.map((q,i)=>i).filter(i=>l==-1||(l==-2?S.hard[K(i)]:Q[i][0]==l));
 if(!ids.length)return;
 R={q:ids,p:0,a:{},w:[],ok:0,n:ids.length};ask()}
function ask(){
 const i=R.q[R.p],q=Q[i];sel=null;
 $("app").innerHTML='<div class="pr"><div style="width:'+(R.p/R.q.length*100)+'%"></div></div>'+
 '<p class="mu">Pytanie '+(R.p+1)+' z '+R.q.length+(R.a[i]?" (powtórka)":"")+" · "+L[q[0]]+'</p><h2>'+q[1]+'</h2>'+
 '<button class="s" onclick="say(Q['+i+'][1])">🔊 Przeczytaj pytanie</button><div>'+
 q[2].map((o,k)=>'<button class="b opt" onclick="pick('+k+')">'+"ABCD"[k]+". "+o+'</button>').join("")+
 '</div><div id="f"><button class="b go" id="chk" disabled onclick="check()">Sprawdź</button></div>'+
 '<p><button class="s" onclick="menu()">Zakończ i wróć do menu</button></p>';
 window.scrollTo(0,0)}
function pick(k){
 sel=k; playSound('click');
 document.querySelectorAll(".opt").forEach((b,j)=>b.classList.toggle("sel",j==k));
 $("chk").disabled=false;
}
function check(){
 const i=R.q[R.p],q=Q[i],c=sel==q[3],first=!R.a[i];R.a[i]=1;
 if(c){ if(first){R.ok++;S.ok[K(i)]=1} delete S.hard[K(i)]; playSound('success'); }
 else{ S.hard[K(i)]=1; if(first){R.w.push(i);R.q.push(i)} playSound('error'); }
 save();
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;b.classList.remove("sel");if(j==q[3])b.classList.add("good");else if(j==sel)b.classList.add("bad")});
 const t=c?"<h3>Dobrze! 🌸</h3>":"<h3>Jeszcze nie. Głowa do góry, tak się uczymy! 💕</h3><p>Wybrałaś: <b>"+q[2][sel]+"</b></p><p>Poprawna odpowiedź: <b>"+q[2][q[3]]+"</b></p>";
 $("f").innerHTML='<div class="fb '+(c?"ok":"no")+'">'+t+"<p><b>Dlaczego?</b> "+q[4]+"</p>"+(c||!first?"":"<p>To pytanie wróci na końcu, żeby sobie je przypomnieć.</p>")+
 '<button class="s" onclick="say(Q['+i+'][4])">🔊 Przeczytaj wyjaśnienie</button></div><button class="b go" onclick="nxt()">Dalej</button>';
 $("f").scrollIntoView({block:"nearest"})}
function nxt(){R.p++;R.p<R.q.length?ask():end()}
function end(){
 let h='<h2>Koniec! 🌟</h2><p>Za pierwszym razem poprawnie: <b>'+R.ok+" z "+R.n+".</b></p>";
 h+=R.w.length?"<h3>Do powtórzenia</h3>"+R.w.map(i=>'<div class="fb no"><p><b>'+Q[i][1]+"</b></p><p>Poprawnie: <b>"+Q[i][2][Q[i][3]]+"</b></p><p>"+Q[i][4]+"</p></div>").join(""):"<p>Brak pomyłek. Jesteś wspaniała!</p>";
 $("app").innerHTML=h+btn("Wróć do menu","menu()");window.scrollTo(0,0)}
fs(0);menu();
</script></body></html>
